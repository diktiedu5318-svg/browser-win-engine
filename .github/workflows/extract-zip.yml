
name: Extract Starter ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          test -f browser-win-engine-starter.zip
          mkdir -p /tmp/project
          unzip -o browser-win-engine-starter.zip -d /tmp/project
          test -d /tmp/project/browser-win-engine
          rsync -a --exclude='.github/' /tmp/project/browser-win-engine/ ./

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m "Extract browser win engine starter"
            git push
          else
            echo "No file changes to commit."
          fi
